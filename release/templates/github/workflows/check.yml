name: Check

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the isolated cached toolchain
        id: tools
        uses: ./.github/actions/prepare-verification
        with:
          cache-write: ${{ github.event_name == 'push' }}
      - name: Run the quick development checks
        env:
          VERIFICATION_IMAGE: ${{ steps.tools.outputs.image }}
        run: docker run --name foliohaven-quick --init --shm-size=1g --env CI=true "$VERIFICATION_IMAGE" pnpm verify:quick
      - name: Collect quick reports
        if: always()
        run: |
          mkdir -p .foliohaven/ci-reports
          if docker container inspect foliohaven-quick > /dev/null 2>&1; then
            docker cp foliohaven-quick:/workspaces/foliohaven/.foliohaven/reports/verification .foliohaven/ci-reports/verification || true
          fi
      - name: Upload quick reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-verification-reports-${{ github.run_attempt }}
          path: .foliohaven/ci-reports
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove the quick container
        if: always()
        run: docker rm -f foliohaven-quick || true

  native:
    name: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up fixed native Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the fixed package manager
        run: npm install --global --no-audit --no-fund pnpm@12.15.0
      - name: Reuse native package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: native-linux-node26-pnpm12-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', '**/package.json') }}
      - name: Check native exports without Git metadata
        run: |
          set -euo pipefail
          native_source="$RUNNER_TEMP/foliohaven-native-quick"
          node scripts/package-release.mjs --source "$GITHUB_WORKSPACE" --directory "$native_source"
          cd "$native_source"
          pnpm install --frozen-lockfile --prod=false
          pnpm check:compiler
