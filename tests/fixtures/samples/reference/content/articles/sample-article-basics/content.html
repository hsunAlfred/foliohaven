<p>
  這篇筆記示範文章的基本結構。文章主標題來自屬性設定，正文由段落與章節組成。
</p>
<h2 id="article-structure">組織文章內容</h2>
<p>
  每個章節都有明確的標題與識別名稱，讀者可以透過目錄或
  <a href="#stable-anchors">頁內連結</a>前往指定段落。
</p>
<h3 id="heading-levels">使用適當的標題層級</h3>
<p>
  主要章節使用 H2，章節內的小節使用 H3。標題表達內容結構，字體與間距交由共用文章樣式處理。
</p>
<h2 id="stable-anchors">保留清楚的章節連結</h2>
<p>
  章節的識別名稱可以被其他文章引用。這段也可從
  <a href="/tools/local-editing/#editing-files">本機編輯範例</a>前往。
</p>
<blockquote>
  <p>先把內容分成容易閱讀的章節，再以有意義的連結串起相關主題。</p>
</blockquote>

  接著可以閱讀<a href="/notes/image-content/">圖片範例</a>，或回到

</p>
